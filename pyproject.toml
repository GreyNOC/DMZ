[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greynoc-dmz"
version = "0.4.2"
description = "GreyNOC DMZ detection validation lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GreyNOC" }]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<16",
  "jinja2>=3.1,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.5,<1",
  "mypy>=1.10,<3"
]
release = [
  "build>=1.2,<2",
  "pyinstaller>=6,<8"
]

[project.scripts]
greynoc-dmz = "greynoc_dmz.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
