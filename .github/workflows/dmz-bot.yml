name: dmz-bot

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

jobs:
  repo-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Security check
        run: greynoc-dmz security-check
      - name: Scenario validation
        run: greynoc-dmz validate-all
